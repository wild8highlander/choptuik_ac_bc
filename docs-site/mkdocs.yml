site_name: Choptuik AC/BC
site_description: Computational framework for spinor corrections on the Klein quartic curve
site_author: Ishak Khamzatovich Isaev
site_url: https://wild8highlander.github.io/choptuik_ac_bc

repo_name: choptuik_ac_bc
repo_url: https://github.com/wild8highlander/choptuik_ac_bc
edit_uri: edit/main/docs-site/docs/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.png
  favicon: assets/favicon.png

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wild8highlander/choptuik_ac_bc
      name: GitHub
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/thumb-down-outline
          name: This page could be improved
          data: 0
          note: Thanks for your feedback!

nav:
  - Home: index.md
  - Tutorials:
    - tutorials/index.md
    - Quick Start: tutorials/quick-start.md
    - Verification: tutorials/verification.md
    - Interactive Menu: tutorials/interactive-menu.md
    - Custom Parameters: tutorials/custom-parameters.md
    - LIGO Analysis: tutorials/ligo-analysis.md
  - Mathematics:
    - mathematics/index.md
    - Klein Quartic: mathematics/klein-quartic.md
    - Spinor Phases: mathematics/spinor-phases.md
    - Dirac Operator: mathematics/dirac-operator.md
    - Choptyuk Formula: mathematics/choptyuk-formula.md
    - Enhanced Verification: mathematics/enhanced-verification.md
    - K3 Surfaces: mathematics/k3-surfaces.md
  - API Reference:
    - api/index.md
    - Core:
      - api/choptyuk-formula.md
      - api/dirac-operator.md
      - api/klein-curve.md
      - api/spinor-phases.md
      - api/qnm.md
      - api/hypothesis.md
      - api/surfaces.md
      - api/enhanced-verification.md
    - Verification:
      - api/verify-all.md
      - api/verify-enhanced.md
    - Simulation: api/simulator.md
    - Visualization: api/plots.md
    - Reporting: api/report-writer.md
  - Development:
    - development/index.md
    - Contributing: development/contributing.md
    - Testing: development/testing.md
    - CI/CD: development/ci-cd.md
    - Release: development/release.md
  - Changelog: changelog.md

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [python/src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_toc_entry: true
            show_source: true
            show_category_heading: true
            members_order: source
            heading_level: 3
            merge_init_into_class: true
            show_if_no_docstring: true
            filters:
              - "!^_"
              - "!^__"

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - bloxman
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

extra_css:
  - stylesheets/extra.css
