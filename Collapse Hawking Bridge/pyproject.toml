[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chbridge"
version = "2.2.0"
description = "Collapse-Hawking Bridge: a dimensionless mapping from critical gravitational collapse to black-hole thermodynamics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Isaev-Proprietary-1.0" }
authors = [
    { name = "Ishak Khamzatovich Isaev" },
]
keywords = [
    "critical collapse", "Choptuik", "black-hole thermodynamics",
    "Hawking radiation", "Page curve", "double-null",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.22",
    "mpmath>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.6"]
# v2.0.1 (IVP-03 advisory): openpyxl is needed only to rebuild
# tables/bridge_workbook.xlsx (scripts/build_workbook.py).
workbook = ["openpyxl>=3.1"]

[tool.setuptools]
packages = ["chbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
