[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "choptyuk-spinor"
version = "1.1.0"
description = "Verification and simulation of spinor corrections b-C and a-C on the Klein quartic curve"
readme = "README.md"
license = {text = "Isaev Proprietary License"}
requires-python = ">=3.10"
authors = [
    {name = "Ishak Khamzatovich Isaev", email = "aslan08_05@mail.ru"},
]
keywords = [
    "spinor-correction",
    "klein-quartic",
    "choptyuk-formula",
    "dirac-operator",
    "lichnerowicz",
    "psl2-7",
    "quasi-normal-modes",
    "gravitational-waves",
    "riemann-surface",
    "spectral-geometry",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "mpmath>=1.3",
]

[project.optional-dependencies]
reports = [
    "python-docx>=0.8.11",
    "reportlab>=4.0",
    "jinja2>=3.1",
]
all = [
    "python-docx>=0.8.11",
    "reportlab>=4.0",
    "jinja2>=3.1",
    "markdown>=3.4",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/wild8highlander/choptuik_ac_bc"
Repository = "https://github.com/wild8highlander/choptuik_ac_bc"
Documentation = "https://wild8highlander.github.io/choptuik_ac_bc/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "verification: marks verification tests",
    "math: marks mathematical correctness tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
