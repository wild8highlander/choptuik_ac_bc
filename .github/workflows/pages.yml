# Deploy MkDocs Material documentation to GitHub Pages
# Triggered on pushes to main that affect docs-site/ or this workflow
# Also supports manual dispatch for on-demand rebuilds

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'python/src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:  # Allow manual trigger

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ── Build job ──────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for mike versioning

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: docs-site/requirements.txt

      - name: Install Python package
        run: |
          pip install --upgrade pip
          pip install -e python/

      - name: Install MkDocs and plugins
        run: |
          pip install -r docs-site/requirements.txt

      - name: Build documentation site
        working-directory: docs-site
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  # ── Deploy job ─────────────────────────────────────────────
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
