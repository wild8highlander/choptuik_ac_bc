# Lint: Code quality checks (ruff, mypy, black, prettier)
# Runs on every push and pull request

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install linters
        run: pip install ruff mypy black

      - name: Ruff check
        working-directory: python
        run: ruff check src/ tests/ --statistics

      - name: Black check
        working-directory: python
        run: black --check src/ tests/ --diff

      - name: Mypy type check
        working-directory: python
        run: mypy src/ --ignore-missing-imports --no-error-summary

  viz-lint:
    name: Next.js lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: interactive-viz/package-lock.json

      - name: Install
        working-directory: interactive-viz
        run: npm ci

      - name: ESLint
        working-directory: interactive-viz
        run: npm run lint --if-present

      - name: Prettier check
        working-directory: interactive-viz
        run: npx prettier --check "src/**/*.{ts,tsx,css}" || true

  java-lint:
    name: Java lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Checkstyle
        working-directory: java-webapp
        run: mvn checkstyle:check || true
