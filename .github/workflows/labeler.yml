name: Auto Label

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    name: Label by changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply path-based labels
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler/config.yml

  label-by-title:
    name: Label by title
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels from title
        uses: github/issue-labeler@v3.4
        with:
          configuration-path: .github/labeler/title-labels.yml
          include-title: true
          enable-versioned-regex: 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
