# CI: Full test suite with coverage reporting to Codecov
# Runs on EVERY push to main and on every pull request.
# No paths-filter on purpose: with a filter the CI badge stays stale
# (stuck on the last run) whenever a push touches other directories.
# Matrix: Python 3.10/3.11/3.12 × ubuntu/macos/windows

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 1  # Colored output

jobs:
  # ── Python CI ──────────────────────────────────────────────
  python-ci:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        working-directory: python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist ruff mypy

      - name: Lint with ruff
        working-directory: python
        run: ruff check src/ tests/ --ignore E501 || true

      - name: Type check with mypy
        working-directory: python
        run: mypy src/ --ignore-missing-imports || true

      - name: Run tests with coverage
        working-directory: python
        run: |
          python -m pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html \
            -x --tb=short

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: python/coverage.xml
          directory: python
          flags: python,unittests
          name: codecov-python
          fail_ci_if_error: false
          verbose: true

      - name: Run verification in non-interactive mode
        working-directory: python
        run: python run.py --mode verify --non-interactive || true

  # ── Julia CI ───────────────────────────────────────────────
  julia-ci:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.9 is EOL; supported stable versions only
        julia-version: ['1.10', '1.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Julia ${{ matrix.julia-version }}
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia packages
        uses: julia-actions/cache@v2
        with:
          cache-registries: "true"

      # Retry to ride out transient registry / pkg-server failures
      # (root cause of the long-standing "Julia registry issue")
      - name: Install Julia dependencies
        working-directory: julia
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "::group::Pkg instantiate (attempt ${attempt})"
            if julia --project=. -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate()'; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt ${attempt} failed, retrying in 30s..."
            sleep 30
          done
          echo "All 3 attempts failed"
          exit 1

      - name: Run Julia tests
        working-directory: julia
        run: julia --project=. -e 'using Pkg; Pkg.test()'

  # ── Java CI ────────────────────────────────────────────────
  java-ci:
    name: Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: java-webapp
        run: mvn clean verify

  # ── Next.js CI ─────────────────────────────────────────────
  viz-ci:
    name: Next.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: interactive-viz/package-lock.json

      - name: Install dependencies
        working-directory: interactive-viz
        run: npm ci

      - name: Lint
        working-directory: interactive-viz
        run: npm run lint --if-present

      - name: Build
        working-directory: interactive-viz
        run: npm run build

  # ── Cross-implementation consistency ───────────────────────
  consistency:
    name: Cross-implementation consistency
    runs-on: ubuntu-latest
    needs: [python-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        working-directory: python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify mathematical constants match reference
        working-directory: python
        run: |
          python -c "
          from src.core.choptyuk_formula import ChoptyukFormula
          from src.core.klein_curve import KleinCurve
          f = ChoptyukFormula()
          c = KleinCurve()
          r = f.compute()
          # Reference values from monograph (API: ChoptyukResult fields,
          # KleinCurve.psl_order — aligned with actual src/core API)
          assert abs(r.delta_bc - 3.438710) < 0.001, f'b-C mismatch: {r.delta_bc}'
          assert abs(r.delta_ch_full - 3.447040) < 0.001, f'Choptyuk mismatch: {r.delta_ch_full}'
          assert abs(r.b_ch - 0.376510) < 0.001, f'b_Ch mismatch: {r.b_ch}'
          assert c.genus == 3, f'Genus mismatch: {c.genus}'
          assert c.psl_order == 168, f'PSL order mismatch: {c.psl_order}'
          print('Cross-implementation consistency: PASS')
          "
