name: CI - Verification Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  python-verify:
    name: Python ${{ matrix.python-version }} Verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          cd python
          pip install -r requirements.txt
      - name: Run verification
        run: |
          cd python
          python run.py --mode verify --non-interactive --output-dir ../output/python
      - name: Upload verification artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-verification-results
          path: output/python/
          retention-days: 30

  julia-verify:
    name: Julia ${{ matrix.julia-version }} Verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.9', '1.10']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Julia ${{ matrix.julia-version }}
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - name: Install dependencies
        run: |
          cd julia
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run verification
        run: |
          cd julia
          julia --project=. run.jl --non-interactive --output ../output/julia

  java-verify:
    name: Java Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and test
        run: |
          cd java-webapp
          mvn clean verify --batch-mode

  viz-build:
    name: Interactive Viz Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: interactive-viz/package-lock.json
      - name: Install dependencies
        run: |
          cd interactive-viz
          npm ci
      - name: Lint
        run: |
          cd interactive-viz
          npm run lint --if-present
      - name: Build
        run: |
          cd interactive-viz
          npm run build

  consistency-check:
    name: Cross-Implementation Consistency
    runs-on: ubuntu-latest
    needs: [python-verify]
    steps:
      - uses: actions/checkout@v4
      - name: Download Python results
        uses: actions/download-artifact@v4
        with:
          name: python-verification-results
          path: output/python/
      - name: Verify key constants match reference
        run: |
          python3 -c "
          import json
          with open('output/python/results.json') as f:
              r = json.load(f)
          ch = r['choptyuk']
          assert abs(ch['delta_bc'] - 3.438710) < 0.001, 'Delta_bC mismatch'
          assert abs(ch['delta_ch_full'] - 3.447040) < 0.001, 'Delta_Ch mismatch'
          assert ch['deviation_bc_pct'] < 1.0, 'b-C deviation too large'
          assert ch['deviation_full_pct'] < 1.0, 'Full deviation too large'
          print('All consistency checks PASSED')
          "
