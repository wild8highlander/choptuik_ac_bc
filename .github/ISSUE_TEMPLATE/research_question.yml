name: Research Question
description: Ask a mathematics/physics research question
labels: [question, research]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Your research question
    validations:
      required: true

  - type: dropdown
    id: topic
    attributes:
      label: Topic Area
      options:
        - Klein Quartic Curve
        - Spinor Phases
        - Dirac Operator
        - Choptuik Critical Exponents
        - Quasi-Normal Modes
        - K3 Surfaces
        - Enhanced Verification
        - Other
