name: Bug Report
description: File a bug report for choptuik_ac_bc
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug
    validations:
      required: true

  - type: dropdown
    id: implementation
    attributes:
      label: Implementation
      description: Which implementation is affected?
      options:
        - Python
        - Julia
        - Java
        - Next.js
        - All
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, package version, etc.
      value: |
        - OS:
        - Python version:
        - choptuik_ac_bc version:
