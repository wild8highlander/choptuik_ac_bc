name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
      placeholder: "When running verify, I get..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How to reproduce the issue
      placeholder: |
        1. cd python/
        2. python run.py --mode verify --non-interactive
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened (include error messages, stack traces)

  - type: dropdown
    id: implementation
    attributes:
      label: Implementation
      description: Which implementation has the bug?
      options:
        - Python
        - Julia
        - Java (Spring Boot)
        - Next.js (Interactive Viz)
        - Documentation
        - CI/CD
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Version of the software (e.g., v2.0.0)

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, etc.
      placeholder: |
        - OS: Ubuntu 24.04
        - Python: 3.12.4
        - NumPy: 1.26.4
