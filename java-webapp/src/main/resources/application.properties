# Choptyuk Spinor Monograph - Application Configuration
# ================================================

# Server
server.port=8080
spring.application.name=choptyuk-spinor-monograph

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# Choptyuk Parameters (all can be overridden)
# Spinor phases
choptyuk.delta-a=1.5707963267948966
choptyuk.delta-b=1.0471975511965976
choptyuk.delta-c=0.4487989505128276

# Klein curve
choptyuk.lambda1=3.838
choptyuk.scalar-curvature=-2.0
choptyuk.genus=3
choptyuk.psl-order=168

# Observation
choptyuk.delta-observed=3.443
choptyuk.max-correction-order=6

# Verification
choptyuk.verification-tolerance=0.0001

# Simulation
choptyuk.sweep-points=100

# Plots
choptyuk.plot-width=1200
choptyuk.plot-height=800
choptyuk.plot-dpi=600
choptyuk.plot-dir=plots

# Reports
choptyuk.report-dir=reports

# Startup
choptyuk.verify-on-startup=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.choptyuk=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
