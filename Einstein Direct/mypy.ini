# mypy configuration for Einstein Direct.
#
# The open9/machines/ directory intentionally contains standalone byte-copies
# of the top-level machines (they must run in isolation inside the open9
# harness). Feeding both copies to mypy in one invocation collides on module
# basenames (amplitude_ladder, deep_echo_v21, ...), so the canonical check is
# two invocations:
#
#     mypy --ignore-missing-imports .            # top level (excludes machines)
#     (cd open9/machines && mypy --ignore-missing-imports .)
#
# Both are expected to be clean. Research-code noise classes are disabled
# below with per-class reasons; real-bug classes (str-format, call-arg,
# name-defined, ...) stay enabled.
#
[mypy]
ignore_missing_imports = True
exclude = (?x)(open9/machines/|open9/tests/)
# --- disabled classes (research-code dynamics, not bugs) ---
# index: numpy scalar/tuple indexing false positives (int vs np.intp)
# assignment: scripts deliberately reuse a name across stages
#   (list of rows -> ndarray of fits); retyping is intended
# var-annotated: empty dict/list initialized then filled in branches
# union-attr: Optional narrowed by guards mypy cannot see across helpers
# call-overload: numpy/scipy overload sets (np.sum, np.where, sparse ops)
# attr-defined: dynamic attributes created in _init_fields-style methods
# dict-item: JSON-shaped result dicts accumulate heterogeneous keys by design
# func-returns-value / return-value: verdict helpers return sentinel None
#   alongside dicts deliberately
# misc / operator / arg-type: mixed numeric promotions (float <-> np.float64)
disable_error_code = index, assignment, var-annotated, union-attr, call-overload, attr-defined, dict-item, func-returns-value, return-value, misc, operator, arg-type
