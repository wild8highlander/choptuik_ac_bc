<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="formal_choptuik hero banner">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1226"/>
      <stop offset="0.55" stop-color="#101A38"/>
      <stop offset="1" stop-color="#0B1226"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8A33D"/>
      <stop offset="0.45" stop-color="#9B7EDE"/>
      <stop offset="1" stop-color="#4CC9F0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8B44A" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#9B7EDE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9B7EDE" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <path id="orbit" d="M 830,210 A 150,58 0 1,1 1130,210 A 150,58 0 1,1 830,210"/>
  </defs>

  <rect width="1280" height="400" fill="url(#space)"/>

  <!-- starfield: SMIL twinkle, staggered -->
  <g fill="#E8ECFF">
    <circle cx="80"  cy="60"  r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="140" r="1.0"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="40"  r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="110" r="1.1"><animate attributeName="opacity" values="1;0.15;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="300" r="1.3"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="70"  r="1.0"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="330" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="90"  cy="330" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="230" r="0.9"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1180" cy="60" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1240" cy="180" r="1.0"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="350" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="240" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="40"  r="1.0"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="2.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- infalling scalar-field waveform, drifting toward the hole -->
  <path d="M 40,200 q 25,-34 50,0 t 50,0 t 50,0 t 50,0 t 50,0 t 50,0 t 50,0 t 50,0 t 50,0 t 50,0"
        fill="none" stroke="#4CC9F0" stroke-width="2.4" opacity="0.65"
        stroke-dasharray="28 10">
    <animate attributeName="stroke-dashoffset" from="380" to="0" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M 40,258 q 25,-22 50,0 t 50,0 t 50,0 t 50,0 t 50,0 t 50,0 t 50,0 t 50,0 t 50,0 t 50,0"
        fill="none" stroke="#9B8CDE" stroke-width="1.8" opacity="0.4"
        stroke-dasharray="20 12">
    <animate attributeName="stroke-dashoffset" from="320" to="0" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- black hole with rotating accretion disk -->
  <g>
    <circle cx="980" cy="205" r="120" fill="url(#glow)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 980 205" to="360 980 205" dur="26s" repeatCount="indefinite"/>
      <ellipse cx="980" cy="205" rx="150" ry="56" fill="none" stroke="url(#disk)" stroke-width="10" opacity="0.85" filter="url(#soft)"/>
      <ellipse cx="980" cy="205" rx="118" ry="42" fill="none" stroke="url(#disk)" stroke-width="5" opacity="0.9"/>
    </g>
    <circle cx="980" cy="205" r="60" fill="none" stroke="#F0C060" stroke-width="2.2" opacity="0.95">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="205" r="46" fill="#05060C"/>
    <circle cx="980" cy="205" r="46" fill="none" stroke="#F5F3EE" stroke-width="0.8" opacity="0.35"/>
    <circle r="5" fill="#FFE9B0">
      <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#orbit"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- title block -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="64" y="150" font-size="60" fill="#F5F3EE" letter-spacing="6">FORMAL</text>
    <text x="64" y="150" font-size="60" fill="#E8B44A" letter-spacing="6" opacity="0.0">
      FORMAL
      <animate attributeName="opacity" values="0;0.35;0" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="64" y="222" font-size="60" fill="#E8B44A" letter-spacing="3">choptuik</text>
    <text x="330" y="222" font-size="60" fill="#F5F3EE" letter-spacing="0">_</text>
    <text x="64" y="268" font-size="21" fill="#C9CBDD" font-style="italic">Toward a machine-checked proof of critical</text>
    <text x="64" y="296" font-size="21" fill="#C9CBDD" font-style="italic">gravitational collapse — Lean 4 · mathlib · Python bridge</text>
  </g>

  <g font-family="'Courier New', monospace" font-size="14">
    <rect x="64" y="322" width="150" height="30" rx="15" fill="#1A2444" stroke="#9B8CDE" stroke-width="1.2"/>
    <text x="139" y="341" text-anchor="middle" fill="#C9BDF0">Lean 4 + mathlib</text>
    <rect x="228" y="322" width="150" height="30" rx="15" fill="#1A2444" stroke="#4CC9F0" stroke-width="1.2"/>
    <text x="303" y="341" text-anchor="middle" fill="#BDE9F7">Python bridge</text>
    <rect x="392" y="322" width="180" height="30" rx="15" fill="#1A2444" stroke="#E8B44A" stroke-width="1.2"/>
    <text x="482" y="341" text-anchor="middle" fill="#F2DCA4">Gap registry G1-G6</text>
  </g>

  <line x1="0" y1="391" x2="1280" y2="391" stroke="#E8B44A" stroke-width="1.4" opacity="0.75"/>
  <text x="1276" y="376" text-anchor="end" font-family="'Courier New', monospace" font-size="12" fill="#7E86A8">wild8highlander/choptuik_ac_bc · formal verification wing</text>
</svg>
