<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="220" viewBox="0 0 1280 220" role="img" aria-label="Gap registry banner">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1226"/>
      <stop offset="1" stop-color="#16142E"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="220" fill="url(#gbg)"/>
  <g fill="#E8ECFF">
    <circle cx="200" cy="50" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="170" r="1.1"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="60" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="1180" cy="160" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="56" y="92" font-size="42" fill="#E86A6A" letter-spacing="4">GAP REGISTRY</text>
    <text x="56" y="130" font-size="19" fill="#C9CBDD" font-style="italic">Six classified gaps between numerical simulation and formal proof</text>
    <text x="56" y="168" font-size="15" fill="#7E86A8">severity: Blocker &gt; High &gt; Medium &gt; Low — every gap owns a resolution strategy</text>
  </g>
  <g font-family="'Courier New', monospace" font-size="14">
    <rect x="600" y="52" width="620" height="34" rx="17" fill="#1C1220" stroke="#E86A6A" stroke-width="1.3">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <text x="622" y="74" fill="#F0A0A0" font-weight="bold">BLOCKER ×2</text>
    <text x="1200" y="74" text-anchor="end" fill="#C9CBDD">G1 existence · G2 stability spectrum</text>
    <rect x="600" y="96" width="620" height="34" rx="17" fill="#1C1812" stroke="#E8A33D" stroke-width="1.3">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <text x="622" y="118" fill="#F2C896" font-weight="bold">HIGH ×2</text>
    <text x="1200" y="118" text-anchor="end" fill="#C9CBDD">G3 singularity geometry · G4 PA-python link</text>
    <rect x="600" y="140" width="620" height="34" rx="17" fill="#1B1A12" stroke="#E8C96A" stroke-width="1.3">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="622" y="162" fill="#EADFA4" font-weight="bold">MEDIUM ×1</text>
    <text x="1200" y="162" text-anchor="end" fill="#C9CBDD">G5 interval arithmetic for strict error bounds</text>
  </g>
  <line x1="0" y1="212" x2="1280" y2="212" stroke="#E8B44A" stroke-width="1.2" opacity="0.7"/>
</svg>
