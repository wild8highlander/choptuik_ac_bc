<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="64" viewBox="0 0 1280 64" role="img" aria-label="Photon divider">
  <defs>
    <linearGradient id="pgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8B44A" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#E8B44A"/>
      <stop offset="0.5" stop-color="#9B8CDE"/>
      <stop offset="0.75" stop-color="#4CC9F0"/>
      <stop offset="1" stop-color="#4CC9F0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="40" y1="32" x2="1240" y2="32" stroke="url(#pgrad)" stroke-width="1.6"/>
  <rect x="34" y="28" width="8" height="8" transform="rotate(45 38 32)" fill="#E8B44A"/>
  <rect x="1238" y="28" width="8" height="8" transform="rotate(45 1242 32)" fill="#4CC9F0"/>
  <circle r="4.5" fill="#FFE9B0">
    <animate attributeName="cx" values="60;1220" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#C9BDF0">
    <animate attributeName="cx" values="1220;60" dur="7.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="7.5s" repeatCount="indefinite"/>
  </circle>
</svg>
