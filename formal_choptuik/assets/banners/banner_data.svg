<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="220" viewBox="0 0 1280 220" role="img" aria-label="Data and figures banner">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1226"/>
      <stop offset="1" stop-color="#0F1B33"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="220" fill="url(#dbg)"/>
  <g fill="#E8ECFF">
    <circle cx="340" cy="50" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="180" r="1.1"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="40" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="56" y="92" font-size="42" fill="#4CC9F0" letter-spacing="4">DATA &amp; FIGURES</text>
    <text x="56" y="130" font-size="19" fill="#C9CBDD" font-style="italic">Deterministic by seed — every plot, GIF and CSV regenerates from one command</text>
    <text x="56" y="168" font-size="15" fill="#7E86A8">seed = 1993 (the Choptuik year) · numpy only · no hidden state</text>
  </g>
  <!-- self-drawing scaling curve -->
  <g stroke="#5A6B85" stroke-width="1.4" fill="none">
    <path d="M 640,170 h 480 M 640,170 V 50"/>
    <path d="M 640,150 h 8 M 640,120 h 8 M 640,90 h 8 M 640,60 h 8 M 700,170 v -8 M 790,170 v -8 M 880,170 v -8 M 970,170 v -8 M 1060,170 v -8"/>
  </g>
  <path d="M 660,140 C 760,136 860,110 950,84 S 1090,58 1110,54"
        fill="none" stroke="#E8B44A" stroke-width="2.6" stroke-dasharray="470" stroke-dashoffset="470">
    <animate attributeName="stroke-dashoffset" values="470;0;0" keyTimes="0;0.75;1" dur="6s" repeatCount="indefinite"/>
  </path>
  <g fill="#4CC9F0">
    <circle cx="660" cy="140" r="4"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="122" r="4"><animate attributeName="opacity" values="0;1;1" keyTimes="0.2;0.35;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="95" r="4"><animate attributeName="opacity" values="0;1;1" keyTimes="0.4;0.55;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="72" r="4"><animate attributeName="opacity" values="0;1;1" keyTimes="0.6;0.75;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1105" cy="56" r="5" fill="#E8B44A"><animate attributeName="opacity" values="0;1;1" keyTimes="0.75;0.9;1" dur="6s" repeatCount="indefinite"/></circle>
  </g>
  <text x="1128" y="60" font-family="'Courier New', monospace" font-size="14" fill="#F2DCA4">γ = 1/λ₀</text>
  <line x1="0" y1="212" x2="1280" y2="212" stroke="#E8B44A" stroke-width="1.2" opacity="0.7"/>
</svg>
