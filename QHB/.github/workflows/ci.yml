name: CI (canon + consistency)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python-canon:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: JSON integrity (all artifacts parse)
        run: python tools/check_json.py
      - name: Master numbers (canon + v2.x layers)
        run: python tools/check_numbers.py
      - name: Canon tests (fast subset)
        run: |
          python -m pytest tests/test_constants.py -q
          python -m pytest tests/test_artifacts.py -q

  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release consistency (VERSION/CHANGELOG/README/checksums/links)
        run: python tools/check_release.py
      - name: Lean scaffolds present + no stray sorries in closed kernels
        run: python tools/check_lean_kernels.py
