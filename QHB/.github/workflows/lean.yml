name: Lean 4 (Mathlib verification)

on:
  push:
    branches: [main, master]
    paths: ["monolith/lean/**", ".github/workflows/lean.yml"]
  pull_request:
    paths: ["monolith/lean/**", ".github/workflows/lean.yml"]
  workflow_dispatch:

jobs:
  mathlib-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache lake packages + Mathlib cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            monolith/lean/.lake
          key: mathlib-${{ runner.os }}-${{ hashFiles('monolith/lean/lean-toolchain') }}
          restore-keys: mathlib-${{ runner.os }}-
      - name: Sync toolchain + pin Mathlib revision
        working-directory: monolith/lean
        run: |
          git clone --depth 1 https://github.com/leanprover/mathlib4.git /tmp/mathlib-src
          cp /tmp/mathlib-src/lean-toolchain .
          REV=$(git -C /tmp/mathlib-src rev-parse HEAD)
          sed -i "s/PINNED_AT_RELEASE/$REV/" lakefile.toml
          echo "Mathlib pinned at $REV, toolchain: $(cat lean-toolchain)"
      - name: Fetch Mathlib cache (pre-built oleans)
        working-directory: monolith/lean
        run: |
          lake update
          lake exe cache get!
      - name: Build QHB formalization (core + T19 Mathlib port)
        working-directory: monolith/lean
        run: lake build
      - name: Axiom audit (#print axioms must be sorry-free)
        working-directory: monolith/lean
        run: |
          lake env lean QHB_AxiomAudit.lean | tee axiom_audit.txt
          if grep -q "sorryAx" axiom_audit.txt; then
            echo "::error::sorryAx detected in a closed kernel"
            exit 1
          fi
          echo "Axiom audit clean: all closed kernels are sorry-free"
