# mypy configuration for QHB.
#
# legacy_v1.2.0/ is the frozen historical snapshot of the package (kept for
# provenance, excluded from every lint scope). Including it in mypy collides
# on the module basename "qhb" with the live package, so it is excluded here.
#
# Canonical check (expected clean):
#
#     mypy --ignore-missing-imports .
#
[mypy]
ignore_missing_imports = True
exclude = (?x)(legacy_v1.2.0/|monolith/|workbook/)
